name: Build large source pack parts

on:
  push:
    branches:
      - source-pack-20260925

permissions:
  contents: read

jobs:
  pack-large:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 02_Book
          - id: 07_Live

    steps:
      - name: Build exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle out meta

          case "${{ matrix.id }}" in
            02_Book)
              printf '%b\n' \
                'opendatalab/MinerU\t9227669985a7876abe5d3181b1cda11a844e7322' \
                'docling-project/docling\t570f956792fcfe8e51bde0f4a79a2ddabc1a061a' \
                'datalab-to/marker\te1a6226adfaab4cd573cfa96e12d60905ee38036' \
                'datalab-to/surya\t514b0bf4c58e59d70edd75571c323e6d118762dd' \
                'Unstructured-IO/unstructured\t1bedf7be0bea9db5c5dc3a9a2dab83078b4db54d' \
                'pymupdf/PyMuPDF\tdfab8cb46aee6c32a8896fd877e87cae329a5268' \
                'ocrmypdf/OCRmyPDF\te59d7627dd7f4e17d117b24f1c636dc37789fa93' \
                'run-llama/llama_index\t2b1f239e39d7c96e6a075309cc6697993a7210bf' \
                'qdrant/qdrant\t6ab21cac18ebb6f4ae29102c7f8f5cc11affd5de' \
                'infiniflow/ragflow\t313ca90f6abd7682fe8523e16fd67b3653a3fa84' \
                > repos.tsv
              ;;
            07_Live)
              printf '%b\n' \
                'godotengine/godot\t30caae98b79ec7e75e5f893290a51b4048eaa141' \
                'Inochi2D/inochi2d\tba2b1413c68d9f7bf575fef790ba0c35715558db' \
                'LorisYounger/VPet\t4f5f4dead067dea1f3be2e6c6fae415cef901cee' \
                > repos.tsv
              ;;
          esac

          printf 'repo\tcommit\tsource_url\tarchive\n' > bundle/MANIFEST.tsv

          while IFS=$'\t' read -r repo sha; do
            [ -n "$repo" ] || continue
            safe="${repo//\//__}"
            short="${sha:0:12}"
            file="${safe}__${short}.zip"
            url="https://github.com/${repo}/archive/${sha}.zip"

            echo "::group::Downloading ${repo}@${sha}"
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 4 \
              --connect-timeout 30 --max-time 1800 \
              "$url" -o "bundle/$file"
            test -s "bundle/$file"
            unzip -tq "bundle/$file" >/dev/null
            printf '%s\t%s\thttps://github.com/%s\t%s\n' "$repo" "$sha" "$repo" "$file" >> bundle/MANIFEST.tsv
            echo "::endgroup::"
          done < repos.tsv

          (
            cd bundle
            sha256sum *.zip > SHA256SUMS.txt
          )

          printf '%s\n' \
            'Exact GitHub source snapshots pinned to commit SHA.' \
            'Nested ZIP files contain tracked repository source files at the pinned commit.' \
            'MANIFEST.tsv records repository provenance and SHA256SUMS.txt verifies nested archives.' \
            > bundle/README.txt

          archive="${{ matrix.id }}_full_source_20260925.zip"
          zip -0 -q -r "$archive" bundle/
          sha256sum "$archive" > meta/SOURCE_SHA256.txt

          split -b 300M -d -a 3 --additional-suffix='' "$archive" "out/$archive.part"
          (
            cd out
            sha256sum * > ../meta/PART_SHA256SUMS.txt
          )

          count="$(find out -maxdepth 1 -type f | wc -l | tr -d ' ')"
          printf '%s\n' \
            "source_file=$archive" \
            "part_count=$count" \
            "part_size=300MiB except final part" \
            "windows: copy /b $archive.part000+$archive.part001+$archive.part002+$archive.part003 $archive" \
            "linux_macos: cat $archive.part* > $archive" \
            > meta/README.txt

          printf '@echo off\r\ncopy /b ' > "meta/combine_${{ matrix.id }}_windows.bat"
          first=1
          for p in out/$archive.part*; do
            bn="$(basename "$p")"
            if [ "$first" -eq 0 ]; then printf '+' >> "meta/combine_${{ matrix.id }}_windows.bat"; fi
            printf '%s' "$bn" >> "meta/combine_${{ matrix.id }}_windows.bat"
            first=0
          done
          printf ' %s\r\n' "$archive" >> "meta/combine_${{ matrix.id }}_windows.bat"

          printf '#!/usr/bin/env bash\nset -e\ncat %s.part* > %s\n' "$archive" "$archive" > "meta/combine_${{ matrix.id }}_linux_macos.sh"

      - name: Upload part 000
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}_part000
          path: out/*.part000
          compression-level: 0
          retention-days: 1

      - name: Upload part 001
        if: ${{ hashFiles('out/*.part001') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}_part001
          path: out/*.part001
          compression-level: 0
          retention-days: 1

      - name: Upload part 002
        if: ${{ hashFiles('out/*.part002') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}_part002
          path: out/*.part002
          compression-level: 0
          retention-days: 1

      - name: Upload part 003
        if: ${{ hashFiles('out/*.part003') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}_part003
          path: out/*.part003
          compression-level: 0
          retention-days: 1

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}_meta
          path: meta/
          compression-level: 0
          retention-days: 1
