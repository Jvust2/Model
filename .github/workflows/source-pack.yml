name: Build LFS and submodule supplements

on:
  push:
    branches:
      - source-pack-20260925

permissions:
  contents: read

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mlc-llm
            repo: mlc-ai/mlc-llm
            sha: 9fa644f54b04983adea4d0168f49fc6af4a893ba
            category: 01_Model
          - id: LocalAI
            repo: mudler/LocalAI
            sha: 543fb4bd240e39123ded0b097f0e995b84e38954
            category: 01_Model
          - id: qdrant
            repo: qdrant/qdrant
            sha: 6ab21cac18ebb6f4ae29102c7f8f5cc11affd5de
            category: 02_Book
          - id: scipy
            repo: scipy/scipy
            sha: c542b6517135dd09c81f00e2e7755b2fbf2f0a72
            category: 04_NCMCM
          - id: browser-use
            repo: browser-use/browser-use
            sha: d8110c5ff87ccba887aaa726cdb780f2f84bef8d
            category: 06_AutoFlow
          - id: prefect
            repo: PrefectHQ/prefect
            sha: 148e99781fb05df258d3efddb5ef4fee0b61c9f2
            category: 06_AutoFlow
          - id: mem0
            repo: mem0ai/mem0
            sha: 989c7da0fc8e4df6342dbb8c448af9816d60d24c
            category: 06_AutoFlow

    steps:
      - name: Clone pinned repo and materialize missing entities
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          echo "Repository: ${{ matrix.repo }}"
          echo "Pinned SHA: ${{ matrix.sha }}"

          git clone "https://github.com/${{ matrix.repo }}.git" repo
          cd repo
          git checkout --detach "${{ matrix.sha }}"

          git lfs install --local
          git lfs pull

          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --recursive
            git submodule foreach --recursive 'git lfs install --local >/dev/null 2>&1; git lfs pull'
          fi

          cd ..
          mkdir -p supplement/root_lfs supplement/submodules meta out

          printf 'path\tsha256\tsize_bytes\n' > supplement/ROOT_LFS.tsv
          (
            cd repo
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              mkdir -p "../supplement/root_lfs/$(dirname "$path")"
              cp -a "$path" "../supplement/root_lfs/$path"
              sum="$(sha256sum "$path" | awk '{print $1}')"
              size="$(stat -c '%s' "$path")"
              printf '%s\t%s\t%s\n' "$path" "$sum" "$size" >> ../supplement/ROOT_LFS.tsv
            done < <(git lfs ls-files -n 2>/dev/null || true)
          )

          printf 'status\n' > supplement/SUBMODULES.tsv
          if [ -f repo/.gitmodules ]; then
            cp repo/.gitmodules supplement/GITMODULES.txt
            (
              cd repo
              git submodule status --recursive >> ../supplement/SUBMODULES.tsv
              while read -r key path; do
                [ -n "$path" ] || continue
                mkdir -p "../supplement/submodules/$path"
                rsync -a --exclude='.git' "$path/" "../supplement/submodules/$path/"
              done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true)
            )
          fi

          printf '%s\\n' \
            'repo=${{ matrix.repo }}' \
            'commit=${{ matrix.sha }}' \
            'category=${{ matrix.category }}' \
            'purpose=Supplement only: actual Git LFS payloads and recursive submodule working-tree contents missing from ordinary GitHub source archives.' \
            'root_lfs_manifest=ROOT_LFS.tsv' \
            'submodule_manifest=SUBMODULES.tsv' \
            > supplement/PROVENANCE.txt

          find supplement -type f ! -name 'FILES_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > supplement/FILES_SHA256SUMS.txt

          archive="${{ matrix.category }}__${{ matrix.id }}__lfs_submodules_20260925.tar.gz"
          tar -czf "$archive" supplement/
          sha256sum "$archive" > meta/SOURCE_SHA256.txt
          printf 'archive=%s\nrepo=%s\ncommit=%s\n' "$archive" "${{ matrix.repo }}" "${{ matrix.sha }}" > meta/README.txt

          split -b 250M -d -a 3 "$archive" "out/$archive.part"
          (
            cd out
            sha256sum * > ../meta/PART_SHA256SUMS.txt
          )

          printf '#!/usr/bin/env bash\nset -e\ncat %s.part* > %s\n' "$archive" "$archive" > "meta/combine_linux_macos.sh"

          printf '@echo off\r\ncopy /b ' > meta/combine_windows.bat
          first=1
          for p in out/$archive.part*; do
            bn="$(basename "$p")"
            if [ "$first" -eq 0 ]; then printf '+' >> meta/combine_windows.bat; fi
            printf '%s' "$bn" >> meta/combine_windows.bat
            first=0
          done
          printf ' %s\r\n' "$archive" >> meta/combine_windows.bat

      - name: Upload part 000
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part000
          path: out/*.part000
          compression-level: 0
          retention-days: 1

      - name: Upload part 001
        if: ${{ hashFiles('out/*.part001') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part001
          path: out/*.part001
          compression-level: 0
          retention-days: 1

      - name: Upload part 002
        if: ${{ hashFiles('out/*.part002') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part002
          path: out/*.part002
          compression-level: 0
          retention-days: 1

      - name: Upload part 003
        if: ${{ hashFiles('out/*.part003') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part003
          path: out/*.part003
          compression-level: 0
          retention-days: 1

      - name: Upload part 004
        if: ${{ hashFiles('out/*.part004') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part004
          path: out/*.part004
          compression-level: 0
          retention-days: 1

      - name: Upload part 005
        if: ${{ hashFiles('out/*.part005') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part005
          path: out/*.part005
          compression-level: 0
          retention-days: 1

      - name: Upload part 006
        if: ${{ hashFiles('out/*.part006') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part006
          path: out/*.part006
          compression-level: 0
          retention-days: 1

      - name: Upload part 007
        if: ${{ hashFiles('out/*.part007') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part007
          path: out/*.part007
          compression-level: 0
          retention-days: 1

      - name: Upload part 008
        if: ${{ hashFiles('out/*.part008') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part008
          path: out/*.part008
          compression-level: 0
          retention-days: 1

      - name: Upload part 009
        if: ${{ hashFiles('out/*.part009') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part009
          path: out/*.part009
          compression-level: 0
          retention-days: 1

      - name: Upload part 010
        if: ${{ hashFiles('out/*.part010') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part010
          path: out/*.part010
          compression-level: 0
          retention-days: 1

      - name: Upload part 011
        if: ${{ hashFiles('out/*.part011') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__part011
          path: out/*.part011
          compression-level: 0
          retention-days: 1

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.category }}__${{ matrix.id }}__meta
          path: meta/
          compression-level: 0
          retention-days: 1
