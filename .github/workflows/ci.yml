name: ci

on:
  pull_request:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile runtime/local_bridge.py

      - name: Run bridge unit tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check assets/config.js
          node --check assets/model-index.js
          node --check assets/drive-client.js
          node --check assets/app.js
          node --check sw.js

      - name: Verify Google API website contract
        run: |
          test -f index.html
          test -f .github/workflows/pages.yml
          test -f governance/PROJECT_STATE.md
          test -f governance/ARCHITECTURE.md
          test -f runtime/Model.cmd
          test -f runtime/launch_model.ps1
          grep -q 'oauthBridge' assets/config.js
          grep -q 'preferredFolderName' assets/config.js
          grep -q 'findFolderByName' assets/drive-client.js
          grep -q 'AI-Model-Vault' index.html
          grep -q 'findVaultBtn' index.html
          grep -q '/v1/chat/completions' assets/app.js
          grep -q 'drive_root_label' runtime/local_bridge.py

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "runtime\launch_model.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify CMD launcher
        shell: cmd
        run: |
          if not exist runtime\Model.cmd exit /b 1
          findstr /C:"launch_model.ps1" runtime\Model.cmd >nul
