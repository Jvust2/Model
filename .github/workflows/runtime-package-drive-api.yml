name: runtime-package-web

on:
  push:
    branches:
      - feat/video-runtime-v09

permissions:
  contents: read

concurrency:
  group: runtime-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build standalone Runtime EXE
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pyinstaller py7zr
          python -m PyInstaller --onefile --name ModelRuntime --paths runtime --collect-all py7zr --add-data "runtime\workflows;workflows" runtime\local_bridge.py
          Copy-Item -Force dist\ModelRuntime.exe runtime\ModelRuntime.exe

      - name: Smoke test standalone Runtime EXE
        shell: powershell
        run: |
          $env:LLAMA_SERVER_PATH = "missing-llama-server.exe"
          $env:MODEL_CACHE_ROOT = "$env:RUNNER_TEMP\model-cache"
          $env:MODEL_BRIDGE_PORT = "8765"
          $env:MODEL_SERVER_PORT = "8080"
          $stdout = "$env:RUNNER_TEMP\runtime-stdout.log"
          $stderr = "$env:RUNNER_TEMP\runtime-stderr.log"
          $p = Start-Process -FilePath "runtime\ModelRuntime.exe" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if ($p.HasExited) {
                Get-Content $stderr -ErrorAction SilentlyContinue
                Get-Content $stdout -ErrorAction SilentlyContinue
                throw "ModelRuntime.exe exited during smoke test."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                if ($health.ok) {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              throw "ModelRuntime.exe health check timed out."
            }
            $video = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/video/status" -TimeoutSec 3
            if (-not $video.workflow_resources_ready) {
              throw "Packaged video workflow resources are missing."
            }
            if (-not $video.archive_support) {
              throw "Packaged Runtime is missing py7zr archive support."
            }
            if (($video.supported_adapters | Measure-Object).Count -lt 2) {
              throw "Expected Wan and Hunyuan video adapters in packaged Runtime."
            }
          }
          finally {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }


      - name: Parse runtime scripts
        shell: powershell
        run: |
          $files = @(
            "runtime\launch_model.ps1",
            "runtime\install_runtime.ps1",
            "runtime\background.ps1",
            "runtime\uninstall_runtime.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}:{2} {3} :: {4}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
              }
              exit 1
            }
          }

      - name: Exercise runtime scripts
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\launch_model.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\install_runtime.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\background.ps1 -SelfTest
          if (-not (Test-Path -LiteralPath "runtime\ModelRuntime.exe" -PathType Leaf)) { throw "ModelRuntime.exe missing after build." }

      - name: Build ZIP
        shell: powershell
        run: |
          $root = "Model-Runtime"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force runtime "$root\runtime"
          Copy-Item -Force README.md "$root\README.md"
          Copy-Item -Force index.html "$root\index.html"
          Copy-Item -Recurse -Force assets "$root\assets"
          Copy-Item -Force sw.js "$root\sw.js"
          Compress-Archive -Path "$root\*" -DestinationPath "Model-Web-Runtime-v0.9.zip" -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Model-Web-Runtime-v0.9
          path: Model-Web-Runtime-v0.9.zip
          if-no-files-found: error
